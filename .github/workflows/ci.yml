name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      # gymnasium is not packaged for rosdep. Only the environment wrapper needs
      # it; stable_baselines3 and torch are deliberately left out, because
      # nothing under test imports them and pulling torch into CI costs minutes
      # for no coverage.
      - name: Install Python dependencies
        run: pip install --break-system-packages gymnasium

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test
          colcon test-result --verbose
